name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test packages
      - run: bun run --filter @yumeoi/app test
      - run: bun run deploy:dry-run
      - name: Check Cloudflare credentials
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_API_TOKEN is empty; preview upload will be skipped."
          else
            echo "CLOUDFLARE_API_TOKEN is set."
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID is empty."
          else
            echo "CLOUDFLARE_ACCOUNT_ID is set."
          fi
      - name: Upload preview Worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: bun run deploy:preview
